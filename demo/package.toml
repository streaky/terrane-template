package = "template-demo"
artifact = "executable"
rust-toolchain = "pinned"

[namespaces]
template-demo = "src"

[profile]
capabilities = ["filesystem"]

[terrane-dependencies.streaky.template]
path = ".."

[consumers.template]
command = "../.trn/consumers/template"
args = ["--namespace", "generated/template/template-demo", "--root", "templates", "--runtime-root", "templates", "--template", "page.html"]
declarations = ["/template-demo::main"]
