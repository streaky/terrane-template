documentation:
  status: complete
  title: "Values"
  title-style: text
  summary: >-
    Construct explicit template values and understand their fields and truthiness behavior.
  tags:
    - "api"
    - "values"
  blocks:
    - type: markdown
      markdown: |-
        Import `template-value`, `text-value`, `bool-value`, `list-value`, `object-value`,
        and `empty-value` from `/streaky/template`. `template-value` has `kind`, `text`,
        `boolean`, `items`, and `fields`; unused fields retain their defaults. Lists contain
        `template-value` items and objects map strings to `template-value`. Construct values
        with the factories rather than relying on implicit host-object conversion.
    - type: example
      id: construct-context-values
      title: "Constructing a template context"
      language: terrane
      mode: illustrative
      target: null
      timeout-ms: null
      source: |-
        from /core/collections import list, map
        from /streaky/template import template-value, text-value, bool-value, list-value, object-value, empty-value

        fields map of string, template-value = map;
        fields.set; 'name', (text-value; 'Ada')
        person template-value = object-value; fields

        people list of template-value = list;
        people.append; person
        roster template-value = list-value; people
        enabled template-value = bool-value; true
        missing template-value = empty-value;
      response: null
      diagnostic: null
      markdown: null
    - type: markdown
      markdown: |-
        `truthy` returns false for the empty value, false booleans, empty text, empty lists,
        and empty objects; it returns the boolean's value for booleans and true for non-empty
        text, lists, and objects. Direct interpolation renders text and booleans as text and
        renders the empty value as an empty string. A list or object cannot be interpolated
        directly. Dot-separated paths resolve object fields only; a missing root or field is
        an error.
        Supported `kind` tags are `none`, `bool`, `text`, `list`, and `object`.
        Unknown tags raise `template-error` during truthiness and interpolation rather
        than becoming false or being mistaken for containers.
    - type: markdown
      markdown: |-
        `template-value.to-string;` supplies the same raw representation used by
        interpolation: text is unchanged, booleans render as `true` or `false`, and
        the empty template value renders as `''` (unlike scalar `none`, which renders
        as `none`). Lists, objects, and unknown tags raise `template-error`.
        String `+`, `.concat;`, `.join;`, and `print;` use this representation too.
        Conversion does not escape HTML; interpolation applies the engine's policy
        and filters after conversion. Widgets must still escape untrusted text for
        their output context.
    - type: example
      language: terrane
      mode: illustrative
      source: |-
        value = text-value; '<Ada>'
        raw = value.to-string;
        label = 'Hello, ' + value
        print; label
