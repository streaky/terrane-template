documentation:
  status: complete
  title: "template-engine"
  title-style: code
  summary: >-
    Assign context values, register widgets, choose template roots, and render source or files.
  tags:
    - "api"
    - "rendering"
  blocks:
    - type: markdown
      markdown: |-
        Create an engine with `instance template-engine;` after importing the class from
        `/template-engine`. `assign(name, value)` stores a template value under a simple name;
        `assign-complex(name, fields)` wraps a string-to-value map as an object.
        `assigned(name)` reports whether a value is set. `append(name, text)` appends to an
        existing text value or creates one, and raises `template-error` if the existing value
        is not text.
    - type: example
      id: engine-operations
      title: "Rendering and registering a widget"
      language: terrane
      mode: illustrative
      target: null
      timeout-ms: null
      source: |-
        from /template-engine import template-engine, template-value, text-value, escape-html

        function badge string; value template-value
            return '<strong>'.concat; (escape-html; value.text), '</strong>'

        engine = instance template-engine;
        engine.assign; 'title', (text-value; 'A page')
        engine.add-path; 'templates'
        engine.register-widget; 'badge', badge
        html = engine.fetch; 'page.html'
        rendered = engine.render; '<p>{{ title }}</p>'
      response: null
      diagnostic: null
      markdown: null
    - type: markdown
      markdown: |-
        Widget handlers have type `function from template-value to string`. `register-widget`
        associates a simple name with a handler. A `{% widget name %}` call passes the empty
        value; `{% widget name path %}` resolves and passes the named value. Returned strings
        are inserted as trusted HTML without automatic escaping.

        `add-path(directory, push=true)` registers a non-empty search directory. With the
        default `push=true`, it appends to the search list; lookup searches from newest to
        oldest. `push=false` prepends a lower-priority directory. `render(source)` compiles
        and renders source using assigned values. `fetch(name)` loads a named file and renders
        it, returning the resulting string. `display(name)` fetches and prints it, adding a
        newline. `render-compiled(program)` renders a previously compiled template. Mutable
        engine methods are marked `mutable` in Terrane; call headers and invocation syntax
        require semicolons.
    - type: markdown
      markdown: |-
        A new engine selects autoescaping from the template name: `.html`, `.htm`, and `.xml`
        enable it case-insensitively; other file names disable it. Unnamed templates from
        `render` or `compile-template` enable it by default. `set-autoescape(enabled)` forces
        one boolean policy for files, strings, and includes. `select-autoescape()` removes
        that override and restores filename selection. `set-string-autoescape(enabled)`
        changes the unnamed-template default; it affects neither named files nor an active
        forced policy. All three configuration methods are mutable. Compiled templates
        retain their name, not a frozen escaping mode, so rendering uses the engine's current
        configuration.
    - type: example
      id: escaping-policy
      title: Configure escaping
      language: terrane
      mode: illustrative
      target: null
      timeout-ms: null
      source: |-
        from /template-engine import template-engine

        engine = instance template-engine;
        engine.set-string-autoescape; false
        engine.set-autoescape; true
        engine.select-autoescape;
      response: null
      diagnostic: null
      markdown: null
    - type: markdown
      markdown: |-
        `escape-html(text)` returns text with the five HTML-sensitive characters escaped.
        The standalone `template-loader` exposes the same `add-path` search policy and
        `load(name)` for callers that need raw UTF-8 template source rather than rendering.
        Assignment names, widget names, and path segments in expressions use ASCII letters,
        digits, underscores, and hyphens. Numeric values can be supplied as text, for example
        with Terrane's canonical text conversion through `''.concat; count`.
