documentation:
  status: complete
  title: "Template"
  title-style: text
  summary: >-
    Render trusted, file-backed templates with explicit values using a compact engine
    implemented in Terrane.
  tags:
    - "template"
    - "templates"
  blocks:
    - type: markdown
      markdown: |-
        `template` provides explicit text, boolean, list, object, and empty values;
        strict interpolation; conditionals; list iteration; includes; and registered widgets.
        It is pure Terrane and has no native Rust package dependencies. It deliberately does
        not implement full Jinja syntax, expressions, inheritance, macros, or automatic
        reflection over host objects.
    - type: markdown
      markdown: |-
        Add the package and its filesystem effect to the consumer manifest. Its manifest
        identity and public namespace are `streaky/template`; `template` is the short
        dependency name. Adjust the illustrative sibling path for the consuming package.
    - type: example
      id: dependency-and-profile
      title: "Dependency and filesystem capability"
      language: toml
      mode: illustrative
      target: null
      timeout-ms: null
      source: |-
        [terrane-dependencies]
        template = { path = "../template" }

        [profile]
        capabilities = ["filesystem"]
      response: null
      diagnostic: null
      markdown: null
    - type: markdown
      markdown: |-
        First run `sh packages/template/build-consumer.sh` from the compiler checkout
        to build the native consumer. Then run the included demo from `packages/template/demo`:
        invoke `../../../target/debug/terrane run .` for a repository-built binary, or
        `terrane run .` when the compiler is installed. It uses `templates/page.html` and
        demonstrates object/list assignment, escaping, includes, and a widget.
  sections:
    - id: start-here
      title: "Start here"
      blocks:
